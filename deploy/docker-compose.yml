# Déploiement LOT2-09 (`catalog-plugin-oauth-tenancy`, D20) — un hôte, pas d'orchestrateur, pas de
# Terraform (architecture.md §6.2). `docker compose up -d` (depuis ce dossier) monte tout ce qui EST
# géré ici ; `docker compose down` arrête tout (les données survivent dans les volumes nommés, jamais
# supprimées sauf `down -v` explicite). Voir RUNBOOK.md pour la procédure complète (déployer une
# version, sauvegarder, restaurer, revenir en arrière).
#
# Ce que ce fichier NE gère PAS, volontairement : MongoDB. `mongo-lot0` (LOT0-09/LOT2-08) est déjà en
# place, déjà la cible de `MONGODB_URI` par défaut de l'application, et sa base `shopify_mcp_server`
# était vide au moment du lot 2 — vérifié (`docker exec mongo-lot0 mongosh ... listCollections`), pas
# supposé. Le faire cohabiter dans CE compose l'aurait recréé (perte de la garantie qu'aucune donnée
# n'a bougé) pour un gain nul : `scripts/provision-infra.sh` se contente de lui poser une politique de
# redémarrage (`docker update --restart unless-stopped`), non destructif. Keycloak, lui, EST recréé ici
# — le conteneur `keycloak-lot0` (D22/LOT0-05, `start-dev`, base EN MÉMOIRE) était explicitement
# jetable ; celui-ci le remplace avec une base Postgres qui survit à un redémarrage (keycloak/README.md,
# point 3 « Persistance », écrit par LOT2-08 en attendant ce lot).
#
# network_mode: host sur les deux processus applicatifs (app, ts) — contrainte du contrat LOT2-03, pas
# un choix de commodité : `RELAY_LOOPBACK_HOST` est câblé en dur à `127.0.0.1` côté TypeScript
# (`mcp-shopify-catalog/src/relay-context.ts`, jamais lu depuis l'environnement — exprès, pour
# qu'aucune valeur d'environnement mal positionnée ne puisse transformer le mode relayé en route
# publique) et le défaut Kotlin (`relay.ts.base-url`, `application.yml`) est `127.0.0.1:8765`. Deux
# conteneurs sur le réseau bridge par défaut auraient chacun leur PROPRE loopback : ils ne se
# verraient jamais. `network_mode: host` les fait cohabiter sur le loopback réel de l'hôte — l'hypothèse
# que le code des deux dépôts fait déjà, vérifiée en lisant `relay-context.ts` avant d'écrire ce
# fichier, pas supposée.
services:
  postgres:
    image: postgres:16
    container_name: shopify-mcp-server-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD manquant — voir .env.example}
    volumes:
      - shopify-mcp-server-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: shopify-mcp-server-keycloak
    restart: unless-stopped
    # `start`, pas `start-dev` (LOT2-12, geste 2) : le certificat Tailscale/Let's Encrypt existe
    # maintenant (deploy/certs/, valide jusqu'au 2026-11-06), le blocage qui justifiait `start-dev`
    # (pas de certificat TLS) est levé. `--import-realm` reste posé pour un futur bootstrap à froid
    # (Postgres vide) — sur un realm déjà persisté (le cas courant depuis LOT2-09), l'importeur
    # Keycloak l'ignore silencieusement (IGNORE_EXISTING) ; patcher le realm vivant est le geste 3,
    # à part, mené par le Dev Backend.
    command: ["start", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?KC_BOOTSTRAP_ADMIN_USERNAME manquant — voir .env.example}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD manquant — voir .env.example}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD manquant — voir .env.example}
      # URL Tailscale figée (D24) — même valeur que le champ "attributes.frontendUrl" du realm importé
      # et que les deux "included.custom.audience" (voir keycloak/realm-shopify-catalog.production.json)
      # : piège déjà rencontré en LOT2-08 (« un jeton obtenu via un autre nom d'hôte porte un autre
      # "iss" et se fait rejeter ») — une seule valeur, jamais recalculée depuis la requête entrante.
      # CORRIGÉ (défaut trouvé en production le 2026-08-09, quelques minutes après ce lot) — cette
      # variable était restée en http:// avec le commentaire ci-dessous (gardé barré pour la trace) :
      # « laissée en http:// délibérément, KC_HOSTNAME ne pilote que la résolution serveur, pas le
      # realm importé […] fenêtre d'incohérence […] refermée par le geste 3 ». C'était faux :
      # KC_HOSTNAME ne pilote PAS que « la résolution serveur » — Keycloak l'utilise aussi pour (a) la
      # console d'admin elle-même (les origines qu'elle charge, réponse à
      # /admin/master/console/) et (b) tout realm qui n'a PAS reçu de patch explicite de son
      # `frontendUrl`. Le geste 3 a patché le realm `shopify-catalog` via kcadm — jamais `master`, qui
      # est resté sans `frontendUrl` propre et retombe donc sur KC_HOSTNAME. Deux symptômes en ont
      # découlé : la console d'admin bloquée par du contenu mixte (elle chargeait des ressources en
      # http:// depuis une page servie en https://), et le point de jeton du realm `master` qui
      # refusait avec « HTTPS required ». Le realm `shopify-catalog`, lui, n'a jamais été affecté —
      # son `frontendUrl` patché au geste 3 prime sur KC_HOSTNAME pour ce realm précis. Valeur
      # désormais alignée sur ce que sert réellement le conteneur (TLS, geste 5) :
      KC_HOSTNAME: https://val-server.tail5e0606.ts.net:8081
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_CERTIFICATE_FILE: /etc/keycloak-certs/val-server.tail5e0606.ts.net.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /etc/keycloak-certs/val-server.tail5e0606.ts.net.key
    ports:
      # Port externe inchangé (8081) — mappé maintenant sur le port HTTPS interne du conteneur (8443)
      # au lieu du port HTTP (8080). Aucun client déjà enregistré ne référence ce port externe dans
      # ses redirectUris : rien à changer côté Claude (LOT2-12, geste 2).
      - "8081:8443"
    volumes:
      - ./../keycloak/realm-shopify-catalog.production.json:/opt/keycloak/data/import/realm-shopify-catalog.json:ro
      - ./certs:/etc/keycloak-certs:ro

  shopify-mcp-server-app:
    image: eclipse-temurin:21-jre
    container_name: shopify-mcp-server-app
    restart: unless-stopped
    network_mode: host
    depends_on:
      - keycloak
    environment:
      MONGODB_URI: mongodb://localhost:27017/shopify_mcp_server
      # HTTPS réel (LOT2-12, geste 5) — le connecteur PRINCIPAL Kotlin (server.port/server.ssl.*,
      # voir application.yml et identity/RelayLoopbackConnectorCustomizer.kt) sert désormais /mcp,
      # /.well-known/** et /actuator/health en TLS sur 8443. Ces trois valeurs suivent le realm patché
      # au geste 3 (frontendUrl, sslRequired, les deux mappers included.custom.audience) : un jeton émis
      # par le realm porte un "iss" en https://, le décodeur doit pointer sur les mêmes URLs https://
      # sous peine de rejet (piège déjà nommé LOT2-08 : "un jeton obtenu via un autre nom d'hôte porte
      # un autre iss et se fait rejeter").
      OAUTH_ISSUER_URI: https://val-server.tail5e0606.ts.net:8081/realms/shopify-catalog
      OAUTH_JWK_SET_URI: https://val-server.tail5e0606.ts.net:8081/realms/shopify-catalog/protocol/openid-connect/certs
      MCP_EXPECTED_AUDIENCE: https://val-server.tail5e0606.ts.net:8443/mcp
      # Q3/D3 — jamais une valeur de complaisance ici : EnvMasterKeyProvider refuse de démarrer si
      # absente/mal formée (vérifié en lisant vault/spi/env/EnvMasterKeyProvider.kt). Val la génère et
      # la pose lui-même dans deploy/.env — voir RUNBOOK.md.
      CATALOG_MASTER_KEY: ${CATALOG_MASTER_KEY:?CATALOG_MASTER_KEY manquant — voir RUNBOOK.md, le service refuse de démarrer sans}
      # Connecteur PRINCIPAL (public) — bascule TLS. SERVER_SSL_CERTIFICATE(_PRIVATE_KEY) pointent
      # dans le conteneur, pas sur l'hôte : voir le montage ./certs ci-dessous. Spring Boot 4.1 lit
      # directement ce bundle PEM (server.ssl.certificate/certificate-private-key) — pas de PKCS12 à
      # fabriquer.
      SERVER_PORT: "8443"
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_CERTIFICATE: /etc/shopify-mcp-server-certs/val-server.tail5e0606.ts.net.crt
      SERVER_SSL_CERTIFICATE_PRIVATE_KEY: /etc/shopify-mcp-server-certs/val-server.tail5e0606.ts.net.key
      # Connecteur ADDITIONNEL (RelayLoopbackConnectorCustomizer) — n'existe QUE parce que
      # SERVER_SSL_ENABLED est vrai ci-dessus (le customizer se désactive sinon), lié en dur à
      # 127.0.0.1 par le code, jamais par une variable d'env : RELAY_LOOPBACK_PORT n'a pas besoin
      # d'être posé (défaut 8080, déjà ce que RELAY_KOTLIN_BASE_URL attend côté TS). Rien à changer
      # ici — le trafic /relay/** reste en clair sur la boucle locale, comme avant cette bascule.
      RELAY_TS_BASE_URL: http://127.0.0.1:8765
      RELAY_KOTLIN_BASE_URL: http://127.0.0.1:8080
    volumes:
      # RELEASE_TAG posé par scripts/deploy.sh, jamais à la main : c'est le mécanisme de retour arrière
      # (releases/<tag>/app.jar, un jar déjà construit par tag — pas un rebuild pendant un incident).
      # Défaut "__unset__" (pas ${VAR:?...}) volontaire : `docker compose` interpole TOUTES les
      # variables du fichier même pour `up postgres keycloak` (provision-infra.sh) — un ":?" ici
      # ferait échouer le provisionnement de l'infra avant le premier déploiement applicatif. C'est
      # deploy.sh qui garde le vrai contrôle (il écrit RELEASE_TAG dans .env avant tout `compose up`
      # touchant ce service).
      - ./releases/${RELEASE_TAG:-__unset__}/app.jar:/app/app.jar:ro
      # Même bundle Let's Encrypt que Keycloak (LOT2-12 geste 2), monté séparément — chemin dédié
      # pour ce service, pas de dépendance implicite au montage du conteneur keycloak. L'image
      # eclipse-temurin:21-jre tourne en root par défaut (vérifié : `docker run --rm
      # eclipse-temurin:21-jre id` -> uid=0) donc la permission 600 de la clé privée (propriétaire
      # `val` sur l'hôte) ne bloque rien ici, contrairement à un conteneur qui tournerait en
      # utilisateur non-root et non 1000.
      - ./certs:/etc/shopify-mcp-server-certs:ro
    command: ["java", "-jar", "/app/app.jar"]

  shopify-mcp-server-ts:
    image: node:22-alpine
    container_name: shopify-mcp-server-ts
    restart: unless-stopped
    network_mode: host
    working_dir: /repo
    environment:
      # RELAY_MODE=true seul suffit à faire refuser tout secret Shopify au démarrage
      # (assertNoLocalShopifyCredentials, relay-context.ts) — ce conteneur n'en reçoit d'ailleurs
      # aucun, il n'y a rien à retirer.
      RELAY_MODE: "true"
      RELAY_TS_BASE_URL: http://127.0.0.1:8765
      RELAY_KOTLIN_BASE_URL: http://127.0.0.1:8080
    volumes:
      # Dépôt B (mcp-shopify-catalog) monté en LECTURE SEULE — DevOps ne touche jamais à ce dépôt, y
      # compris depuis un conteneur. `dist/` doit déjà être construit (`npm run build`, fait le
      # 2026-08-07 par LOT2-03) ; ce compose ne le reconstruit pas.
      - ${MCP_SHOPIFY_CATALOG_PATH:-/home/val/IA_sandbox/mcp-shopify-catalog}:/repo:ro
      # LOT2-10 — trouvé et corrigé en écrivant le runbook d'octroi : ce conteneur tourne en `root`
      # (image `node:22-alpine` par défaut, pas de directive `user:` ici), donc `os.homedir()` côté
      # TypeScript (`credential-source.ts`) résout `/root`, jamais `/home/val`. SANS ce montage,
      # `~/.config/shopify-catalog/credentials.json` de l'hôte est INVISIBLE du conteneur — pas
      # seulement pour une boutique qu'on viendrait d'ajouter, pour TOUTES, y compris Vélotrip et
      # LureLab déjà seedées. Conséquence vérifiée avant ce montage : `resolveStoreSelection()` rend
      # `{mode: "none", available: []}` en permanence, donc les 76 outils RELAIS refusent tout appel
      # avec « Boutique inconnue de ce process relayé » quel que soit le slug envoyé par Kotlin — un
      # mode de panne qui n'a RIEN à voir avec un défaut de synchronisation slug ⇄ fichier, et que la
      # sonde de `healthcheck.sh` ne peut pas voir (elle teste que le port répond, pas qu'un outil
      # relayé aboutit). Monté en fichier unique (pas le dossier entier) pour ne pas exposer au
      # conteneur d'autres fichiers que Val pourrait un jour poser dans `~/.config/shopify-catalog/`.
      - ${SHOPIFY_CATALOG_CREDENTIALS_PATH:-/home/val/.config/shopify-catalog/credentials.json}:/root/.config/shopify-catalog/credentials.json:ro
    command: ["node", "dist/index.js"]

volumes:
  shopify-mcp-server-postgres-data:
