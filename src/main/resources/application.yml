# security.md : "pas d'endpoint public sauf ceux explicitement marqués comme tels". Actuator
# health (LOT0-02) et l'endpoint PRM RFC 9728 (LOT0-05, voir
# identity/ResourceServerSecurityConfiguration.kt) sont les deux seuls endpoints publics du
# serveur ; /mcp exige un jeton valide. La liste d'exposition Actuator ci-dessous est écrite
# explicitement (pas laissée à un défaut implicite) pour que "health" soit un choix, pas un oubli,
# et pour qu'ajouter un endpoint plus tard oblige à toucher cette ligne.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  # Le contournement posé en LOT0-02 (management.health.mongodb.enabled: false, le temps qu'aucun
  # module n'ait de dépendance réelle à Mongo et que Docker soit absent) est retiré ici : LOT0-03
  # branche cinq vrais repositories sur une vraie instance Mongo, Docker est désormais disponible.
  # L'indicateur de santé Mongo redevient un vrai motif de DOWN, comme prévu dès le départ.
