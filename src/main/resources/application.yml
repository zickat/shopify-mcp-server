# LOT2-12 geste 4 — un seul processus, deux connecteurs Tomcat. `server.*` reste le connecteur
# PRINCIPAL (public) : `/mcp`, `/.well-known/**`, `/actuator/health`. Il ne porte PAS TLS par défaut
# (`server.ssl.enabled` vaut false tant que rien ne le change) — dev et tests tournent donc en clair
# sur 8080 sans toucher à un certificat, comme avant cette tâche. En production, `SERVER_PORT=8443` et
# `SERVER_SSL_ENABLED=true` (+ les deux chemins PEM) basculent ce connecteur en HTTPS réel (Boot 4.1
# accepte le bundle PEM directement — `server.ssl.certificate`/`server.ssl.certificate-private-key`,
# pas de PKCS12 à fabriquer). Le SECOND connecteur — additionnel, lié en dur à `127.0.0.1`, jamais
# TLS — n'est ajouté QUE si `server.ssl.enabled` est vrai (voir
# identity/RelayLoopbackConnectorCustomizer.kt) : c'est lui qui sert `/relay/**` une fois que le
# connecteur principal a quitté le clair, pour que `RELAY_KOTLIN_BASE_URL=http://127.0.0.1:8080`
# (dépôt B, jamais lu depuis l'environnement côté TS) continue de pointer vers quelque chose qui
# répond. Défense en profondeur avec `LoopbackOnlyAuthorizationManager` (identity/) : celui-ci teste
# l'adresse de connexion réelle au niveau applicatif, celui-là fait que l'OS refuse toute connexion
# qui n'arrive pas déjà par la boucle locale — deux gardes, pas une redite.
server:
  port: ${SERVER_PORT:8080}
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}
    certificate: ${SERVER_SSL_CERTIFICATE:}
    certificate-private-key: ${SERVER_SSL_CERTIFICATE_PRIVATE_KEY:}

spring:
  application:
    name: shopify-mcp-server

  ai:
    mcp:
      server:
        protocol: STREAMABLE
        name: "shopify-mcp-server"
        version: "0.0.1"
        type: SYNC
        description: "Serveur MCP distant du catalogue Shopify — credentials, OAuth, droits par boutique, audit"
        streamable-http:
          mcp-endpoint: /mcp

  # LOT0-03 : le préfixe Boot 3.x `spring.data.mongodb` n'existe plus en Boot 4.1 — la classe de
  # propriétés a migré vers `org.springframework.boot.mongodb.autoconfigure.MongoProperties`,
  # préfixe `spring.mongodb` (constaté en décompilant spring-boot-mongodb-4.1.0.jar après qu'un
  # `spring.data.mongodb.uri` silencieusement ignoré ait fait démarrer le serveur contre
  # localhost:27017 par défaut, même avec la variable d'env positionnée — aucune erreur, aucun
  # avertissement, juste le défaut de la lib. À vérifier de la même façon avant toute autre
  # propriété Mongo si elle semble ignorée).
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/shopify_mcp_server}

  security:
    oauth2:
      resourceserver:
        jwt:
          # LOT0-05 — D2/D3 : Q1 (choix de l'IdP) n'est pas tranchée. Ces deux valeurs sont les
          # SEULES choses à changer pour brancher un vrai IdP au lot 2 — aucun code à toucher
          # (voir identity/ResourceServerSecurityConfiguration.kt). Défauts non fonctionnels : au
          # démarrage sans variables d'env, le décodeur pointe vers un JWKS local inexistant —
          # échoue au premier jeton présenté, jamais au démarrage (résolution paresseuse).
          issuer-uri: ${OAUTH_ISSUER_URI:https://idp.invalid/}
          jwk-set-uri: ${OAUTH_JWK_SET_URI:http://localhost:0/jwks}

# mcp.security.expected-audience : constante de configuration (jamais dérivée de la requête —
# voir identity/AudienceValidator.kt). Doit valoir l'URL publique de CE serveur une fois déployé.
# relay-loopback-port : port du connecteur additionnel décrit ci-dessus (server.*, LOT2-12 geste 4).
# Défaut 8080 pour matcher `RELAY_KOTLIN_BASE_URL` sans variable d'env supplémentaire côté déploiement.
mcp:
  security:
    expected-audience: ${MCP_EXPECTED_AUDIENCE:http://localhost:8080/mcp}
    relay-loopback-port: ${RELAY_LOOPBACK_PORT:8080}

# relay : LOT2-03, échafaudage transitoire (architecture.md D23, §2.4 — module `relay`, détruit au
# lot 8). `ts.base-url` est la boucle locale du processus TypeScript relayé (127.0.0.1 uniquement,
# jamais de route publique) — le mode HTTP loopback côté TS reste à construire (dépôt B, hors
# périmètre d'écriture de LOT2-03). `manifest` est la table de routage NATIF/RELAIS du corpus
# (architecture.md §4.2) : LOT2-03 construit le mécanisme et ne peuple qu'une entrée de
# vérification (`check_shopify_connection`, le tour d'horloge décrit dans le lot) ; LOT2-07 peuple
# les noms réels. Un outil absent d'ici est refusé, jamais relayé — échec fermé (schema.md §6).
#
# LOT2-07 — le corpus réel compte **80** outils, pas 79 : relecture ligne à ligne de
# `mcp-shopify-catalog/src/{index.ts,tools/*.ts}` (79 sites `registerTool(...)`, dont un — la
# boucle `publish_page`/`unpublish_page` de `pages.ts` — en enregistre deux). Le chiffre « 79 »
# documenté ailleurs dans cette initiative (architecture.md, schema.md, tasks.md) date d'une
# lecture antérieure à l'ajout de `guide-cover.ts`/`home-hero.ts`/`editorial-image-generation.ts`
# et de la paire publish/unpublish_page — voir progress.md, entrée LOT2-07, pour le détail de la
# vérification et le script utilisé. 5 en NATIF (`list_stores`/`use_store`/`create_redirect`/
# `search_resources`, portés lots précédents, + `list_menus`, LOT3-03), 75 en RELAIS. La
# classification READ/MUTATION de chaque entrée RELAIS est tirée de la description de l'outil dans
# le dépôt TS (effet Shopify réel), pas du nom seul — détail et cas limites (outils
# `generate_*`/`retouch_*` sans effet Shopify tant que non attachés) dans progress.md.
#
# LOT3-03 — `list_menus` bascule NATIF plus tôt que prévu par sa propre tâche (« la table de routage
# ne bascule pas cette nuit »), pas par choix produit : Spring Boot refuse de démarrer dès que deux
# `SyncToolSpecification` portent le même nom (l'annotation-scan de `ListMenusTool` et cette entrée
# RELAIS s'enregistraient toutes deux comme `list_menus`, `mcpSyncServer` échouait à la création).
# Construire l'outil MCP demandé par la tâche ET laisser cette ligne à RELAIS n'étaient donc pas
# compatibles — voir progress.md, entrée LOT3-03, pour le détail et pourquoi Val doit trancher avant
# tout déploiement (l'équivalence avec Shopify réel n'est pas encore prouvée, c'est LOT3-04).
#
# LOT4-02 — `get_seo` bascule NATIF pour la même raison mécanique que `list_menus` (LOT3-03) : le
# module `GetSeoTool` s'enregistre lui aussi comme `get_seo`, même conflit de nom au démarrage sinon.
# 6 en NATIF désormais, 74 en RELAIS — total inchangé (80).
#
# LOT4-03 — `list_metaobjects`/`get_metaobject` basculent NATIF pour la même raison mécanique que
# `list_menus`/`get_seo` : `ListMetaobjectsTool`/`GetMetaobjectTool` s'enregistrent sous ces deux
# noms, même conflit de `SyncToolSpecification` au démarrage sinon. 8 en NATIF désormais, 72 en
# RELAIS — total inchangé (80).
#
# LOT4-04 — `get_page_metafields`/`list_pages` basculent NATIF pour la même raison mécanique que
# `list_menus`/`get_seo`/`list_metaobjects` : `GetPageMetafieldsTool`/`ListPagesTool` s'enregistrent
# sous ces deux noms, même conflit de `SyncToolSpecification` au démarrage sinon. 10 en NATIF
# désormais, 70 en RELAIS — total inchangé (80).
#
# LOT5-04 — `search_products`/`get_raw_content`/`get_enriched_content`/`list_to_review`/
# `list_orphan_products` basculent NATIF pour la même raison mécanique que les lots précédents :
# `SearchProductsTool`/`GetRawContentTool`/`GetEnrichedContentTool`/`ListToReviewTool`/
# `ListOrphanProductsTool` s'enregistrent sous ces cinq noms, même conflit de `SyncToolSpecification`
# au démarrage sinon. 15 en NATIF désormais, 65 en RELAIS — total inchangé (80).
#
# LOT2-23 (D31) — `generate_product_images`/`generate_cross_product_image`/`generate_editorial_scene`/
# `retouch_editorial_image` basculent `kind: READ` → `kind: MUTATION`. `route` reste `RELAIS` pour les
# quatre — ce n'est pas un portage, c'est une correction de classification : chacun émet
# `stagedUploadsCreate` après un appel facturé à Gemini (`shared.ts:1637`), donc une identité `viewer`
# ne doit pas pouvoir les appeler et l'audit ne doit pas les journaliser `isMutation: false`. 6 entrées
# `RELAIS`+`READ` restent après ce lot (`check_shopify_connection`, `get_guide_section_state`,
# `get_home_editorial`, `list_guide_themes`, `list_home_selection`, `list_testimonials`) — épinglées
# dans `RelayManifestCompletenessTest`.
relay:
  ts:
    base-url: ${RELAY_TS_BASE_URL:http://127.0.0.1:8765}
  manifest:
