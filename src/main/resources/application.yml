spring:
  application:
    name: shopify-mcp-server

  ai:
    mcp:
      server:
        protocol: STREAMABLE
        name: "shopify-mcp-server"
        version: "0.0.1"
        type: SYNC
        description: "Serveur MCP distant du catalogue Shopify — credentials, OAuth, droits par boutique, audit"
        streamable-http:
          mcp-endpoint: /mcp

  # LOT0-03 : le préfixe Boot 3.x `spring.data.mongodb` n'existe plus en Boot 4.1 — la classe de
  # propriétés a migré vers `org.springframework.boot.mongodb.autoconfigure.MongoProperties`,
  # préfixe `spring.mongodb` (constaté en décompilant spring-boot-mongodb-4.1.0.jar après qu'un
  # `spring.data.mongodb.uri` silencieusement ignoré ait fait démarrer le serveur contre
  # localhost:27017 par défaut, même avec la variable d'env positionnée — aucune erreur, aucun
  # avertissement, juste le défaut de la lib. À vérifier de la même façon avant toute autre
  # propriété Mongo si elle semble ignorée).
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/shopify_mcp_server}

  security:
    oauth2:
      resourceserver:
        jwt:
          # LOT0-05 — D2/D3 : Q1 (choix de l'IdP) n'est pas tranchée. Ces deux valeurs sont les
          # SEULES choses à changer pour brancher un vrai IdP au lot 2 — aucun code à toucher
          # (voir identity/ResourceServerSecurityConfiguration.kt). Défauts non fonctionnels : au
          # démarrage sans variables d'env, le décodeur pointe vers un JWKS local inexistant —
          # échoue au premier jeton présenté, jamais au démarrage (résolution paresseuse).
          issuer-uri: ${OAUTH_ISSUER_URI:https://idp.invalid/}
          jwk-set-uri: ${OAUTH_JWK_SET_URI:http://localhost:0/jwks}

# mcp.security.expected-audience : constante de configuration (jamais dérivée de la requête —
# voir identity/AudienceValidator.kt). Doit valoir l'URL publique de CE serveur une fois déployé.
mcp:
  security:
    expected-audience: ${MCP_EXPECTED_AUDIENCE:http://localhost:8080/mcp}

# relay : LOT2-03, échafaudage transitoire (architecture.md D23, §2.4 — module `relay`, détruit au
# lot 8). `ts.base-url` est la boucle locale du processus TypeScript relayé (127.0.0.1 uniquement,
# jamais de route publique) — le mode HTTP loopback côté TS reste à construire (dépôt B, hors
# périmètre d'écriture de LOT2-03). `manifest` est la table de routage NATIF/RELAIS des 79 outils
# (architecture.md §4.2) : LOT2-03 construit le mécanisme et ne peuple qu'une entrée de
# vérification (`check_shopify_connection`, le tour d'horloge décrit dans le lot) ; LOT2-07 peuple
# les 79 noms réels. Un outil absent d'ici est refusé, jamais relayé — échec fermé (schema.md §6).
relay:
  ts:
    base-url: ${RELAY_TS_BASE_URL:http://127.0.0.1:8765}
  manifest:
    - tool-name: check_shopify_connection
      route: RELAIS
      kind: READ

# security.md : "pas d'endpoint public sauf ceux explicitement marqués comme tels". Actuator
# health (LOT0-02) et l'endpoint PRM RFC 9728 (LOT0-05, voir
# identity/ResourceServerSecurityConfiguration.kt) sont les deux seuls endpoints publics du
# serveur ; /mcp exige un jeton valide. La liste d'exposition Actuator ci-dessous est écrite
# explicitement (pas laissée à un défaut implicite) pour que "health" soit un choix, pas un oubli,
# et pour qu'ajouter un endpoint plus tard oblige à toucher cette ligne.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  # Le contournement posé en LOT0-02 (management.health.mongodb.enabled: false, le temps qu'aucun
  # module n'ait de dépendance réelle à Mongo et que Docker soit absent) est retiré ici : LOT0-03
  # branche cinq vrais repositories sur une vraie instance Mongo, Docker est désormais disponible.
  # L'indicateur de santé Mongo redevient un vrai motif de DOWN, comme prévu dès le départ.
